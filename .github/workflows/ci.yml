name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: seed + parity
        run: |
          python -m meterhouse seed
          python -m meterhouse parity
      - name: verify (hard gate: semantic layer vs ground truth)
        run: python scripts/verify_metrics.py
